# 對外唯一入口（預設 80 埠）：
#   /          → React 前端（SPA）
#   /api/      → FastAPI（api:8000）
#   /legacy/   → 舊版 Streamlit（legacy:8501，尚未搬到新前端的模組）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 客戶分析可能要等模型回應
        proxy_read_timeout 180s;
    }

    location = /legacy {
        return 302 /legacy/;
    }

    location /legacy/ {
        proxy_pass http://legacy:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamlit 靠 WebSocket 即時更新畫面
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Vite 產生的檔名含雜湊，可以長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其餘路徑交給 React Router（重新整理 /sales/orders 也能開）
    location / {
        # location 內有 add_header 時不會繼承 server 層的，所以這裡重列一次
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
