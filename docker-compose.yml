# 前後端分離部署：瀏覽器只連 web（nginx），其餘服務只在 Docker 內部網路互通。
#
#   docker compose --env-file .env.docker up -d --build
#   瀏覽器開 http://<這台電腦的 IP>:${ERP_HTTP_PORT:-80}
#
# 設定檔 .env.docker 請從 .env.docker.example 複製後修改；它只在執行時讀取，不會被打包進映像。

name: erp

x-backend: &backend
  # 設 ERP_BACKEND_IMAGE 可改用 GitHub 上預先建好的映像（見 README）
  image: ${ERP_BACKEND_IMAGE:-erp-backend:local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: .env.docker
      required: false
  environment:
    ERP_DB_PATH: /app/data/erp.db
    TZ: Asia/Taipei
  volumes:
    - erp-data:/app/data
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  legacy:
    <<: *backend
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.baseUrlPath=legacy
      - --server.headless=true
      - --browser.gatherUsageStats=false
    # 等 API 先把資料庫初始化完，避免兩邊同時建表
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/legacy/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ${ERP_WEB_IMAGE:-erp-web:local}
    build:
      context: ./web
    ports:
      - "${ERP_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      legacy:
        condition: service_started
    restart: unless-stopped

volumes:
  erp-data:
